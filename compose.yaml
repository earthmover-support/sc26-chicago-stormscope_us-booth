# Runs the StormScope-US pipeline continuously on the host's GPU, publishing to Arraylake.
#
#   mkdir -p secrets
#   printf %s "<token>" > secrets/arraylake_api_token
#   docker compose up -d --build
#   docker compose logs -f
#
# GOES-19 data is public on AWS, so the Arraylake token is the only secret.
# STORMSCOPE_REGION=lat_min,lat_max,lon_min,lon_max restricts the run to a box
# (default: full CONUS).
#
# Arguments after the service name replace the default command, e.g. a one-off pinned run:
#   docker compose run --rm pipeline python scripts/stormscope_us_pipeline.py --start-time 2026-11-16T18:00
services:
  pipeline:
    build: .
    image: stormscope-us-pipeline:latest
    restart: unless-stopped
    environment:
      STORMSCOPE_PUBLISH_TARGET: ${STORMSCOPE_PUBLISH_TARGET:-arraylake}
      ARRAYLAKE_REPO: ${ARRAYLAKE_REPO:-nvidia/sc26-chicago-stormscope_us-booth}
      STORMSCOPE_REGION: ${STORMSCOPE_REGION:-}
    secrets:
      - arraylake_api_token
    volumes:
      - cache:/cache
      - outputs:/app/outputs
    # NGC's recommended settings for its PyTorch-based containers
    shm_size: 1g
    ulimits:
      memlock: -1
      stack: 67108864
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

secrets:
  arraylake_api_token:
    file: ./secrets/arraylake_api_token

volumes:
  cache:
  outputs:
